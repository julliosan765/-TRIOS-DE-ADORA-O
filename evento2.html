<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Evento 2 - Culto de Louvor</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --gap:10px; --bg:#eff0c7; --accent:#4517b1; --white:#fff; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:Arial, sans-serif;color:#000;text-align:center}
  nav{background:var(--accent);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
  nav a{color:var(--white);text-decoration:none;font-family:'Cinzel',serif;font-weight:700;font-size:18px}
  .logo{height:48px}
  h1{font-family:'Cinzel',serif;color:#5c00c4;margin:18px 0 4px}
  h2{font-family:'Cinzel',serif;color:#5c00c4;margin:4px 0 18px}
  .gallery-wrap{max-width:1100px;margin:0 auto;padding:0 12px 40px}
  .grid{display:grid;gap:var(--gap);grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));}
  .item{background:#ddd;border:0;padding:0;cursor:pointer;display:block;width:100%;aspect-ratio:1/1;overflow:hidden;border-radius:8px;position:relative}
  .item img, .item video{width:100%;height:100%;object-fit:cover;display:block}
  .item .play{position:absolute;inset:auto 8px 8px 8px;color:#fff;background:rgba(0,0,0,0.4);padding:6px 8px;border-radius:6px;font-weight:700;font-family:'Cinzel',serif;font-size:14px}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;visibility:hidden;opacity:0;transition:opacity .2s}
  .lightbox.open{visibility:visible;opacity:1}
  .lb-content{max-width:1200px;max-height:90vh;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
  .lb-media{max-width:100%;max-height:100%;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,0.6)}
  .lb-media img, .lb-media video{width:100%;height:auto;max-height:90vh;display:block}
  .lb-close, .lb-prev, .lb-next{position:absolute;top:12px;background:rgba(255,255,255,0.08);color:#fff;border:0;padding:8px 12px;border-radius:6px;cursor:pointer;font-family:'Cinzel',serif;font-weight:700}
  .lb-close{right:12px}
  .lb-prev{left:12px;top:50%;transform:translateY(-50%)}
  .lb-next{right:12px;top:50%;transform:translateY(-50%)}
  @media (min-width:700px){ .grid{grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));} }
  @media (min-width:1000px){ .grid{grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));} }
  .descricao{max-width:900px;margin:12px auto;font-weight:700;padding:0 12px}
</style>
</head>
<body>

<nav>
  <a href="index.html">Início</a>
  <img src="AD JOAQUIM GOMES.png" alt="Logo" class="logo">
</nav>

<h1>ÁTRIOS DE ADORAÇÃO</h1>
<h2>Evento 2 — Culto de Louvor</h2>

<div class="descricao">Clique nas imagens ou vídeos para ampliar.</div>

<div class="gallery-wrap">
  <!-- Grid VISUAL (os itens de mídia ficam no final do arquivo) -->
  <div class="grid" id="gallery" aria-live="polite" tabindex="0"></div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="lb-content">
    <button class="lb-prev" id="lbPrev" aria-label="Anterior">‹</button>
    <div id="lbInner"></div>
    <button class="lb-next" id="lbNext" aria-label="Próximo">›</button>
    <button class="lb-close" id="lbClose" aria-label="Fechar">Fechar ✕</button>
  </div>
</div>

<!--
  MÍDIAS: coloque AQUI as fotos e vídeos para o Evento 2.
  Exemplo: ajuste os caminhos em data-src / src / data-poster conforme seus arquivos.
-->
<div id="media-source" style="display:none">
  <button class="item" data-type="image" data-src="media/evento2_img1.jpg" aria-label="Abrir imagem 1">
    <img src="media/evento2_img1.jpg" alt="Descrição da imagem 1">
  </button>

  <button class="item" data-type="image" data-src="media/evento2_img2.jpg" aria-label="Abrir imagem 2">
    <img src="media/evento2_img2.jpg" alt="Descrição da imagem 2">
  </button>

  <button class="item" data-type="video" data-src="media/evento2_vid1.mp4" data-poster="media/evento2_vid1_poster.jpg" aria-label="Abrir vídeo 1">
    <img src="media/evento2_vid1_poster.jpg" alt="Miniatura do vídeo 1">
    <span class="play">▶</span>
  </button>

  <button class="item" data-type="image" data-src="media/evento2_img3.jpg" aria-label="Abrir imagem 3">
    <img src="media/evento2_img3.jpg" alt="Descrição da imagem 3">
  </button>

  <!-- Adicione mais itens aqui -->
</div>

<script>
(function(){
  const gallery = document.getElementById('gallery');
  const source = document.getElementById('media-source');
  while(source.firstElementChild){
    gallery.appendChild(source.firstElementChild);
  }

  const lightbox = document.getElementById('lightbox');
  const lbInner = document.getElementById('lbInner');
  const lbClose = document.getElementById('lbClose');
  const lbPrev = document.getElementById('lbPrev');
  const lbNext = document.getElementById('lbNext');

  const items = Array.from(gallery.querySelectorAll('.item'));
  let current = -1;

  function openAt(index){
    if(index < 0 || index >= items.length) return;
    current = index;
    const item = items[current];
    const type = item.dataset.type;
    const src = item.dataset.src;
    const poster = item.dataset.poster || '';
    lbInner.innerHTML = '';
    if(type === 'image'){
      const img = document.createElement('img');
      img.src = src;
      img.alt = item.querySelector('img')?.alt || '';
      img.className = 'lb-media';
      lbInner.appendChild(img);
    } else if(type === 'video'){
      const vid = document.createElement('video');
      vid.src = src;
      vid.controls = true;
      vid.autoplay = true;
      vid.playsInline = true;
      if(poster) vid.poster = poster;
      vid.className = 'lb-media';
      lbInner.appendChild(vid);
    }
    lightbox.classList.add('open');
    lightbox.setAttribute('aria-hidden','false');
    document.body.style.overflow='hidden';
    lbClose.focus();
  }

  function closeLB(){
    const v = lbInner.querySelector('video');
    if(v){ try{ v.pause(); v.currentTime = 0; }catch(e){} }
    lightbox.classList.remove('open');
    lightbox.setAttribute('aria-hidden','true');
    lbInner.innerHTML = '';
    document.body.style.overflow='';
    current = -1;
  }

  function showNext(offset){
    if(current === -1) return;
    let idx = (current + offset + items.length) % items.length;
    openAt(idx);
  }

  items.forEach((el, i)=>{
    el.addEventListener('click', ()=> openAt(i));
    el.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openAt(i); }
    });
  });

  lbClose.addEventListener('click', closeLB);
  lbPrev.addEventListener('click', ()=> showNext(-1));
  lbNext.addEventListener('click', ()=> showNext(1));

  document.addEventListener('keydown', (e)=>{
    if(lightbox.classList.contains('open')){
      if(e.key === 'Escape') closeLB();
      if(e.key === 'ArrowLeft') showNext(-1);
      if(e.key === 'ArrowRight') showNext(1);
    }
  });

  lightbox.addEventListener('click', (e)=>{
    if(e.target === lightbox) closeLB();
  });

  let startX = null;
  lbInner.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive:true});
  lbInner.addEventListener('touchend', e => {
    if(startX === null) return;
    const dx = e.changedTouches[0].clientX - startX;
    if(dx > 50) showNext(-1);
    else if(dx < -50) showNext(1);
    startX = null;
  }, {passive:true});
})();
</script>

</body>
</html>
