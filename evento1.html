<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Evento 1 - Vigília Jovem</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{ --gap:10px; --bg:#eff0c7; --accent:#4517b1; --white:#fff; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);font-family:Arial, sans-serif;color:#000;text-align:center}
  nav{background:var(--accent);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:60}
  nav a{color:var(--white);text-decoration:none;font-family:'Cinzel',serif;font-weight:700;font-size:18px}
  .logo{height:48px}
  h1{font-family:'Cinzel',serif;color:#5c00c4;margin:18px 0 4px}
  h2{font-family:'Cinzel',serif;color:#5c00c4;margin:4px 0 18px}
  .gallery-wrap{max-width:1100px;margin:0 auto;padding:0 12px 40px}
  .grid{display:grid;gap:var(--gap);grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));}
  .item{background:#ddd;border:0;padding:0;cursor:pointer;display:block;width:100%;aspect-ratio:1/1;overflow:hidden;border-radius:8px;position:relative}
  .item img, .item video{width:100%;height:100%;object-fit:cover;display:block}
  .item .play{position:absolute;inset:auto 8px 8px 8px;color:#fff;background:rgba(0,0,0,0.4);padding:6px 8px;border-radius:6px;font-weight:700;font-family:'Cinzel',serif;font-size:14px}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;padding:20px;z-index:120;visibility:hidden;opacity:0;transition:opacity .18s}
  .lightbox.open{visibility:visible;opacity:1}
  .lb-content{width:100%;max-width:1200px;max-height:calc(100vh - 40px);display:flex;align-items:center;justify-content:center;position:relative;padding:12px;box-sizing:border-box}
  #lbInner{width:100%;display:flex;align-items:center;justify-content:center;max-height:calc(100vh - 120px)}
  .lb-media{width:100%;height:auto;max-height:calc(100vh - 140px);object-fit:contain;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,0.6);display:block}
  .lb-close, .lb-prev, .lb-next{position:absolute;background:rgba(255,255,255,0.08);color:#fff;border:0;padding:8px 12px;border-radius:6px;cursor:pointer;font-family:'Cinzel',serif;font-weight:700}
  .lb-close{top:12px;right:12px;z-index:130}
  .lb-prev{left:8px;top:50%;transform:translateY(-50%);z-index:130}
  .lb-next{right:8px;top:50%;transform:translateY(-50%);z-index:130}
  .descricao{max-width:900px;margin:12px auto;font-weight:700;padding:0 12px}
  .item video.thumb{filter:brightness(.95);pointer-events:none}

  @media (max-width:700px){
    .lb-prev, .lb-next{display:none}
    .lb-close{top:8px;right:8px;padding:6px 8px}
    .lb-content{padding:8px}
    #lbInner{max-height:calc(100vh - 100px)}
    .lb-media{max-height:calc(100vh - 120px)}
  }
</style>
</head>
<body>

<nav>
  <a href="index.html">Início</a>
  <img src="AD JOAQUIM GOMES.png" alt="Logo" class="logo">
</nav>

<h1>ÁTRIOS DE ADORAÇÃO</h1>
<h2>35° Aniversário do Departamento</h2>

<div class="descricao">Clique nas imagens ou vídeos para ampliar.</div>

<div class="gallery-wrap">
  <div class="grid" id="gallery"></div>
</div>

<div id="lightbox" class="lightbox">
  <div class="lb-content">
    <button class="lb-prev" id="lbPrev">‹</button>
    <div id="lbInner"></div>
    <button class="lb-next" id="lbNext">›</button>
    <button class="lb-close" id="lbClose">Fechar ✕</button>
  </div>
</div>

<!-- SUA ORDEM ORIGINAL AQUI -->
<div id="media-source" style="display:none">

  <button class="item" data-type="video" data-src="APRESENTACAO.mp4">
    <video class="thumb" muted playsinline autoplay loop preload="metadata">

    </video>

  <button class="item" data-type="image" data-src="DIA 10.jpg">

  <button class="item" data-type="image" data-src="SANTIFICACAO.jpg">

  </button>

  <button class="item" data-type="video" data-src="VIDE1.mp4">

      <source src="VIDE1.mp4" type="video/mp4">
    </video>

  </button>

  <button class="item" data-type="image" data-src="DIA8.jpg">

  </button>

  <button class="item" data-type="image" data-src="DIA7.jpg">
    <img src="DIA7.jpg">
  
  <button class="item" data-type="image" data-src="DIA5.jpg">
    <img src="DIA5.jpg">

    <button class="item" data-type="image" data-src="DIA4.jpg">

</div>

<script>
(function(){
  const gallery = document.getElementById('gallery');
  const source = document.getElementById('media-source');

  // AGORA NÃO ORDENA MAIS NADA
  const nodes = Array.from(source.querySelectorAll('.item'));
  nodes.forEach(n => gallery.appendChild(n));

  const lightbox = document.getElementById('lightbox');
  const lbInner = document.getElementById('lbInner');
  const lbClose = document.getElementById('lbClose');
  const lbPrev = document.getElementById('lbPrev');
  const lbNext = document.getElementById('lbNext');

  const items = Array.from(gallery.querySelectorAll('.item'));
  let current = -1;

  function openAt(index){
    current = index;
    const item = items[current];
    const type = item.dataset.type;
    const src = item.dataset.src;

    lbInner.innerHTML = '';

    if(type === 'image'){
      const img = document.createElement('img');
      img.src = src;
      img.className = 'lb-media';
      lbInner.appendChild(img);

    } else if(type === 'video'){
      const vid = document.createElement('video');
      vid.className = 'lb-media';
      vid.controls = true;
      vid.autoplay = true;

      const s = document.createElement('source');
      s.src = src;
      s.type = "video/mp4";
      vid.appendChild(s);

      lbInner.appendChild(vid);
      vid.load();
    }

    lightbox.classList.add('open');
    document.body.style.overflow = "hidden";
  }

  function closeLB(){
    const v = lbInner.querySelector('video');
    if(v){
      v.pause();
      v.src = "";
      v.remove();
    }
    lightbox.classList.remove('open');
    lbInner.innerHTML = '';
    document.body.style.overflow = "";
  }

  items.forEach((el, i)=>{
    el.addEventListener('click', ()=> openAt(i));
  });

  lbPrev.addEventListener('click', ()=> openAt((current - 1 + items.length) % items.length));
  lbNext.addEventListener('click', ()=> openAt((current + 1) % items.length));
  lbClose.addEventListener('click', closeLB);

})();
</script>

</body>
</html>
